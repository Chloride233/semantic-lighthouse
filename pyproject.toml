[project]
name = "semantic-lighthouse"
version = "0.1.0"
description = "Enterprise-grade RAG/Agent prototype foundation for Semantic Lighthouse."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0.0",
    "PyJWT>=2.9.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "SQLAlchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
